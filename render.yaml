services:
  - type: web
    name: ayurvedic-traceability-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./ayurvedic_traceability.db
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: ayurvedic-traceability-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
