services:
  - type: web
    name: ayurvedic-traceability-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: postgresql://new_9q20_user:x69YfFjuVDuFUY86Uyy92m2Oro2dLBWB@dpg-da7jjfm1egvs739rvbrg-a/new_9q20
      - key: BACKEND_CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true

  - type: web
    name: ayurvedic-traceability-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ayurvedic-traceability-1.onrender.com/api

